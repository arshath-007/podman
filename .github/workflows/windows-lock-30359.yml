name: Podman 30359 Final Validation

on:
  push:
    branches: [test/30359-windows-lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-combined:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      CONTAINERS_MACHINE_PROVIDER: wsl
      WSL_UTF8: '1'

    steps:
      - name: Configure line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Apply complete fix
        shell: pwsh
        run: |
          git apply --check 30359.patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git apply 30359.patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git add -N pkg/machine/e2e/start_windows_test.go
          git diff --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build Windows client
        shell: pwsh
        run: |
          .\winmake.ps1 podman-remote
          .\winmake.ps1 win-gvproxy

      - name: Verify WSL
        shell: pwsh
        run: |
          wsl --update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wsl --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Static analysis and unit tests
        shell: pwsh
        run: |
          $tags = 'remote exclude_graphdriver_btrfs containers_image_openpgp'
          go vet -mod=vendor -tags $tags ./pkg/machine ./pkg/machine/wsl ./pkg/machine/e2e
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -mod=vendor -count=1 -tags $tags ./pkg/machine ./pkg/machine/wsl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify directory-lock fix
        shell: pwsh
        run: |
          $env:PODMAN_BINARY = "$PWD\bin\windows\podman.exe"
          $env:CONTAINERS_HELPER_BINARY_DIR = "$PWD\bin\windows"
          .\winmake.ps1 localmachine start_windows_test.go

      - name: Verify existing machine operations
        shell: pwsh
        run: |
          $env:PODMAN_BINARY = "$PWD\bin\windows\podman.exe"
          $env:CONTAINERS_HELPER_BINARY_DIR = "$PWD\bin\windows"
          .\winmake.ps1 localmachine start_test.go
          .\winmake.ps1 localmachine stop_test.go
          .\winmake.ps1 localmachine api_test.go
