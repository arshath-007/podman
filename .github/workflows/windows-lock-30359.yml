name: Windows directory lock 30359
on:
  push:
    branches: [test/30359-windows-lock]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'arshath-007/podman' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, proxy, bootstrap, combined]
    env:
      CONTAINERS_MACHINE_PROVIDER: wsl
      WSL_UTF8: '1'
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Prepare candidate
        shell: pwsh
        run: |
          git apply --include=pkg/machine/e2e/start_windows_test.go 30359.patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:VARIANT -in 'proxy','combined') {
            git apply --include=pkg/machine/machine_windows.go 30359.patch
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          if ($env:VARIANT -in 'bootstrap','combined') {
            git apply --include=pkg/machine/wsl/stubber.go 30359.patch
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          git status --short
      - name: Build Windows client and fetch matching helpers
        shell: pwsh
        run: |
          .\winmake.ps1 podman-remote
          .\winmake.ps1 win-gvproxy
          if (!(Test-Path .\bin\windows\win-sshproxy.exe)) { throw 'Missing proxy' }
      - name: Verify WSL
        shell: pwsh
        run: |
          wsl --update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wsl --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wsl --status
      - name: Prepare directory lock diagnostics
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "handle-30359"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $zip = Join-Path $folder "Handle.zip"
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Handle.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $folder -Force
          $handle = Join-Path $folder "handle64.exe"
          $sig = Get-AuthenticodeSignature -LiteralPath $handle
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Handle signature' }
          "PODMAN_30359_HANDLE=$handle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $path = "pkg/machine/e2e/start_windows_test.go"
          $source = Get-Content -LiteralPath $path -Raw
          $needle = 'Expect(os.Remove(dir)).To(Succeed())'
          if ([regex]::Matches($source, [regex]::Escape($needle)).Count -ne 1) { throw 'Expected one removal assertion' }
          $replacement = @'
          if removeErr := os.Remove(dir); removeErr != nil {
              GinkgoWriter.Printf("30359 removal failed: %v\n", removeErr)
              diagCtx, cancelDiag := context.WithTimeout(context.Background(), 30*time.Second)
              defer cancelDiag()
              diag := exec.CommandContext(diagCtx, os.Getenv("PODMAN_30359_HANDLE"), "-accepteula", "-nobanner", filepath.Base(dir))
              diag.WaitDelay = 5*time.Second
              report, diagErr := diag.CombinedOutput()
              GinkgoWriter.Printf("30359 HANDLE OUTPUT (err=%v):\n%s\n", diagErr, report)
              Expect(removeErr).To(Succeed())
          }
          '@
          $source.Replace($needle, $replacement.TrimEnd()) | Set-Content -LiteralPath $path -Encoding utf8 -NoNewline
          gofmt -w $path
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run directory deletion and API forwarding regression
        shell: pwsh
        run: |
          $env:PODMAN_BINARY = "$PWD\bin\windows\podman.exe"
          $env:CONTAINERS_HELPER_BINARY_DIR = "$PWD\bin\windows"
          .\winmake.ps1 localmachine start_windows_test.go
